<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Finance Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Finance Tracker</a>
    <nav>
      <a href="/">Year</a>
      <a href="/credit">Credit</a>
      <a href="/data">Import / export</a>
    </nav>
    {% if user %}
    <form method="post" action="/logout" class="who">
      <span>{{ user.name or user.email or "Signed in" }}</span>
      <button class="link">Sign out</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
